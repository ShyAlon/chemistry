name: Test, build and deploy chemistry

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Validate current main, or restore a previously tested merged release
        type: choice
        options: [validate-main, restore, restore-snapshot]
        default: validate-main
      run_id:
        description: Restore only, exact successful candidate run ID
        type: string
      source_commit:
        description: Restore only, full merged main commit SHA for that candidate
        type: string

permissions:
  contents: read

concurrency:
  group: chemistry-${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  build:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'validate-main' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # PR default is the synthetic merge tree, not head-only.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/test-release-output.py
      - run: npm run build
      - name: Reject stale recovery output in the same PR
        run: python3 scripts/release-output.py check-snapshot
      - name: Package only after every gate passes
        run: python3 scripts/release-output.py package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Retain tested production output, not test stubs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release
          path: release.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'restore' || inputs.operation == 'restore-snapshot')))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: chemistry-pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Verify run, source lineage and output, never rebuild
        run: python3 scripts/release-output.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RESTORE_RUN: ${{ inputs.run_id }}
          RESTORE_COMMIT: ${{ inputs.source_commit }}
      - name: Upload verified static output
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: verified-dist
          retention-days: 1
      - name: Recheck main before publication
        run: python3 scripts/release-output.py recheck
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
